# Analyse SonarQube du frontend Angular. Lancée par le Jenkinsfile avec sonar-scanner CLI :
#   sonar-scanner -Dsonar.host.url=... -Dsonar.token=...
sonar.projectKey=stb-bank-front-office
sonar.projectName=STB Bank - Front Office (Angular)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
