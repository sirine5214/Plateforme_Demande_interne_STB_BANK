# Analyse SonarQube du frontend Angular. Lancée par le Jenkinsfile avec sonar-scanner CLI :
#   sonar-scanner -Dsonar.host.url=... -Dsonar.token=...
sonar.projectKey=stb-bank-front-office
sonar.projectName=STB Bank - Front Office (Angular)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/**
# Deux chemins car la convention depend du runner : Karma ecrivait dans
# coverage/<nom-projet>/, Vitest (le runner configure dans angular.json) ecrit dans coverage/.
# SonarQube ignore silencieusement un chemin absent, lister les deux est sans risque.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/gradient-able-free-angular-admin-template/lcov.info
sonar.sourceEncoding=UTF-8
