# Surcharge de src/main/resources/application.properties pour les tests (@SpringBootTest).
# Spring Boot place src/test/resources avant src/main/resources sur le classpath de test,
# donc ce fichier est pris en compte automatiquement, sans profil à activer.
#
# But : que `contextLoads` (et tout futur test chargeant le contexte complet) tourne sans
# dépendre d'un Postgres accessible - notamment depuis l'agent Jenkins, qui n'a pas accès à
# localhost:5434 (le Postgres de dev local défini par défaut dans application.properties).

spring.datasource.url=jdbc:h2:mem:stb_bank_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
