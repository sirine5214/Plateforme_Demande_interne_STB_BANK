# Fichier de profil "test" : Spring Boot le charge PAR-DESSUS src/main/resources/application.properties
# (contrairement à un simple application.properties dans src/test/resources, qui l'aurait
# entièrement remplacé sur le classpath de test - shadowing par nom de fichier identique,
# pas fusion). Activé via @ActiveProfiles("test") sur BackOfficeApplicationTests.
#
# But : que `contextLoads` (et tout futur test chargeant le contexte complet) tourne sans
# dépendre du Postgres de dev (localhost:5434, injoignable depuis l'agent Jenkins).
#
# Un vrai Postgres (pas H2) : conteneur dédié "jenkins-backend-test-db" toujours actif sur
# le réseau Docker "jenkins-network", partagé avec ce conteneur Jenkins - voir
# docker-compose-jenkins.yml. Testcontainers a été essayé mais ne fonctionne pas sur cette
# instance : Docker Engine API 1.52, le docker-java embarqué dans Testcontainers refuse de
# négocier au-delà de 1.32.
spring.datasource.url=jdbc:postgresql://jenkins-backend-test-db:5432/stb_bank_test
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop
