spring.application.name=Back_office
# 8082 par defaut pour le poste de developpement (IDE). En conteneur, SERVER_PORT vaut 8080 :
# c'est le port attendu par le mapping docker-compose, par le HEALTHCHECK du Dockerfile et par
# la cible « backend:8080 » de Prometheus. Laisser 8082 en dur ici rendait le conteneur
# injoignable des trois cotes a la fois.
server.port=${SERVER_PORT:8082}

# --- PostgreSQL ---
# Les valeurs par défaut conviennent au poste de développement (IDE + Postgres local sur 5434).
# En Docker/Kubernetes, ces variables d'environnement sont surchargées (voir docker-compose.yml / k8s/).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:stb_bank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sirin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:EwBvEyDXm0yjJ1XzuCbgVULr/qOoKT5hy+qn99OObsUvzDvHGMIEByxfkC2mtcaM}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Sécurité applicative ---
# En développement uniquement : renvoie le jeton de réinitialisation dans la réponse HTTP,
# faute de service d'e-mail. À laisser à false en production.
app.exposer-jeton-reset=${EXPOSER_JETON_RESET:true}

# --- Uploads ---
app.upload-dir=${UPLOAD_DIR:uploads/avatars}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# --- Boite partagee des demandes internes (releve IMAP) ---
# client=fake : boite en memoire, aucun serveur requis. C'est le reglage par defaut, celui
# qui permet a l'application et a la CI de demarrer sans compte de messagerie.
# client=imap : releve reelle. Basculer ici une fois la boite de service ouverte.
stb.mail.client=${MAIL_CLIENT:fake}
stb.mail.host=${MAIL_HOST:localhost}
stb.mail.port=${MAIL_PORT:1143}
stb.mail.protocol=${MAIL_PROTOCOL:imap}
stb.mail.dossier=${MAIL_DOSSIER:INBOX}
# Jamais d'identifiants en dur : ils viennent de l'environnement, comme JWT_SECRET.
stb.mail.username=${MAIL_USERNAME:}
stb.mail.password=${MAIL_PASSWORD:}
stb.mail.releve-active=${MAIL_RELEVE_ACTIVE:true}
stb.mail.intervalle-ms=${MAIL_INTERVALLE_MS:120000}
stb.mail.delai-initial-ms=${MAIL_DELAI_INITIAL_MS:30000}
stb.mail.taille-lot=${MAIL_TAILLE_LOT:25}
stb.mail.taille-max-piece-jointe=${MAIL_TAILLE_MAX_PJ:10485760}
app.email-attachments-dir=${EMAIL_ATTACHMENTS_DIR:uploads/emails}

# --- Supervision (Actuator / Prometheus / Grafana) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
# Histogrammes de percentiles sur les requetes HTTP : sans cette ligne Micrometer
# n'expose qu'un summary (count/sum/max) et les series http_server_requests_seconds_bucket
# n'existent pas, ce qui rend tout panel Grafana base sur histogram_quantile() vide.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Bornes de SLO explicites : garantit des buckets aux seuils qui nous interessent
# (et borne la cardinalite au lieu de laisser Micrometer generer ses ~70 buckets par defaut).
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s
# Meme chose pour les appels repository Spring Data.
management.metrics.distribution.percentiles-histogram.spring.data.repository.invocations=true
