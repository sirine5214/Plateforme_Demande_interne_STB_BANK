spring.application.name=Back_office
server.port=8080

# --- PostgreSQL ---
# Les valeurs par défaut conviennent au poste de développement (IDE + Postgres local sur 5434).
# En Docker/Kubernetes, ces variables d'environnement sont surchargées (voir docker-compose.yml / k8s/).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:stb_bank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sirin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:EwBvEyDXm0yjJ1XzuCbgVULr/qOoKT5hy+qn99OObsUvzDvHGMIEByxfkC2mtcaM}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Sécurité applicative ---
# En développement uniquement : renvoie le jeton de réinitialisation dans la réponse HTTP,
# faute de service d'e-mail. À laisser à false en production.
app.exposer-jeton-reset=${EXPOSER_JETON_RESET:true}

# --- Uploads ---
app.upload-dir=${UPLOAD_DIR:uploads/avatars}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# --- Supervision (Actuator / Prometheus / Grafana) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
