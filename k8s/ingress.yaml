# Nécessite un ingress controller (ex: ingress-nginx) installé sur le cluster :
#   helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stb-bank
  namespace: stb-bank
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m" # aligné sur spring.servlet.multipart.max-file-size
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # WebSocket temps réel (/ws)
spec:
  ingressClassName: nginx
  rules:
    - host: stb-bank.local # à remplacer par le domaine réel (et ajouter un bloc tls: pour HTTPS)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
