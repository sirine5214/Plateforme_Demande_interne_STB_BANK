apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: stb-bank
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  JWT_EXPIRATION_MS: "86400000"
  EXPOSER_JETON_RESET: "false" # désactivé en production : pas de retour du jeton de reset dans la réponse HTTP
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stb-bank
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stb-bank
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Permet à Prometheus de découvrir ce pod sans installer kube-prometheus-stack
        # (voir aussi k8s/monitoring/servicemonitor.yaml si un Prometheus Operator est utilisé).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          # Remplacé au déploiement par le Jenkinsfile : kubectl set image deployment/backend backend=<image>:<tag>
          image: sirine5214/stb-back-office:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: stb-secrets, key: POSTGRES_DB } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: stb-secrets, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stb-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: stb-secrets, key: JWT_SECRET } }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: stb-bank
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: stb-bank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
