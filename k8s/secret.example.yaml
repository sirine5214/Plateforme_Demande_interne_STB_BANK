# Gabarit : copier en k8s/secret.yaml, remplacer les valeurs, puis `kubectl apply -f`.
# k8s/secret.yaml est listé dans .gitignore et ne doit jamais être commité avec de vraies valeurs.
# Alternative recommandée en production : générer ce secret depuis un coffre externe
# (Vault, Sealed Secrets, SOPS...) plutôt que de le committer, même chiffré.
apiVersion: v1
kind: Secret
metadata:
  name: stb-secrets
  namespace: stb-bank
type: Opaque
stringData:
  POSTGRES_DB: stb_bank
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: change-me-generate-a-long-random-base64-string
  GRAFANA_ADMIN_PASSWORD: change-me
